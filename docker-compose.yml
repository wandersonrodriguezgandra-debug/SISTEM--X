version: '3'
services:
  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    volumes:
      - db_data:/var/lib/postgresql/data
  web:
    build: .
    ports:
      - '8000:8000'
    depends_on:
      - db
volumes:
  db_data: {}